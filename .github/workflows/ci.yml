name: Continuous Integration

# Trigger CI on integration/feature pushes and pull requests to main or dev.
on:
  push:
    branches:
      - dev
      - 'feat/**'
  pull_request:
    branches:
      - main
      - dev

jobs:
  test-and-build:
    name: Run Backend Tests, Package, and Upload Artifact
    runs-on: ubuntu-latest
    env:
      BACKEND_TEST_DATABASE_URL: jdbc:postgresql://127.0.0.1:5432/backend_test_db
      BACKEND_TEST_DATABASE_USER: backend_test
      BACKEND_TEST_DATABASE_PASSWORD: membership-test-only

    # PostgreSQL service container for database migrations and test execution
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: backend_test_db
          POSTGRES_USER: backend_test
          POSTGRES_PASSWORD: membership-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U backend_test -d backend_test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # Step 1: Check out repository source code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Set up Java 25 runtime environment and enable Maven caching
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      # Step 3: Ensure executable permissions on the Maven wrapper script
      - name: Grant execute permission for Maven wrapper
        run: chmod +x backend/mvnw

      # Step 4: Execute automated backend tests
      - name: Run Backend Tests
        run: ./mvnw test
        working-directory: backend

      # Step 5: Compile and package the application into a JAR artifact
      - name: Build Application Package
        run: ./mvnw package -DskipTests
        working-directory: backend

      # Step 6: Upload the packaged JAR artifact to GitHub Actions artifact storage
      - name: Upload Application Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gw-backend-jar
          path: backend/target/*.jar
          retention-days: 7

  rebase-check:
    name: Rebase feature branch on dev
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/feat/'))
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout task branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Fetch latest dev and require it in task branch history
        run: |
          git fetch --no-tags origin +refs/heads/dev:refs/remotes/origin/dev
          if ! git merge-base --is-ancestor origin/dev HEAD; then
            echo '::error::Rebase this task branch onto the latest origin/dev, rerun checks, and push again.'
            exit 1
          fi
          if [ -n "$(git rev-list --merges origin/dev..HEAD)" ]; then
            echo '::error::Do not merge dev into the task branch; rebase the task commits onto origin/dev.'
            exit 1
          fi
