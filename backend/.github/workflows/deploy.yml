name: Deploy to Render

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-render-backend-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify backend build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: backend_test_db
          POSTGRES_USER: backend_test
          POSTGRES_PASSWORD: backend-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U backend_test -d backend_test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      BACKEND_TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/backend_test_db
      BACKEND_TEST_DATABASE_USER: backend_test
      BACKEND_TEST_DATABASE_PASSWORD: backend-test-only
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Build and test
        run: ./mvnw -B test

      - name: Package
        run: ./mvnw -B -DskipTests package

  deploy:
    name: Trigger Render deploy
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Trigger Render deploy (backend)
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_BACKEND }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "Missing repository secret RENDER_DEPLOY_HOOK_BACKEND" >&2
            exit 1
          fi
          curl -fsS -X POST "$HOOK"
