spring.datasource.url=${BACKEND_TEST_DATABASE_URL:jdbc:postgresql://127.0.0.1:55432/backend_test_db}
spring.datasource.username=${BACKEND_TEST_DATABASE_USER:backend_test}
spring.datasource.password=${BACKEND_TEST_DATABASE_PASSWORD:backend-test-only}
spring.jpa.hibernate.ddl-auto=validate
# Tests drive reconciliation explicitly; keep scheduled expiry out of shared fixture contexts.
jobs.expiry.worker-enabled=false
# Cached Spring contexts must share PostgreSQL's connection budget. Five connections still allow
# a held race guard, two competing HTTP transactions and the lock-observation query.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0

accounts.expiry.worker-enabled=false
