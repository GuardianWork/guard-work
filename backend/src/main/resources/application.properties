spring.application.name=backend
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_LOCAL_PORT:${POSTGRES_PORT:5432}}/${POSTGRES_DB:backend_db}
spring.datasource.username=${POSTGRES_USER:backend_user}
spring.datasource.password=${POSTGRES_PASSWORD:backend_password}
spring.datasource.driver-class-name=org.postgresql.Driver

guardwork.jwt.access-expiration-ms=${GUARDWORK_JWT_ACCESS_EXPIRATION_MS:900000}
# Empty for same-origin Vite/gateway routing; opt in to direct browser access explicitly.
guardwork.cors.allowed-origins=${GUARDWORK_CORS_ALLOWED_ORIGINS:}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# Operational logging: console only; see docs/convention/backend-logging.md.
logging.level.root=INFO
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
logging.level.com.guardwork.backend=${APP_LOG_LEVEL:INFO}
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.org.hibernate.orm.jdbc.extract=OFF
logging.level.org.hibernate.orm.jdbc.error=OFF
logging.level.org.hibernate.engine.jdbc.spi.SqlExceptionHelper=OFF
# These warnings embed rejected values or exception messages in plain text.
logging.level.org.springframework.web.servlet.mvc.support.DefaultHandlerExceptionResolver=ERROR
logging.level.org.springframework.web.servlet.PageNotFound=OFF
# Never print Spring Security's generated development password.
logging.level.org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration=OFF

spring.flyway.out-of-order=true

cloudinary.api_key=${CLOUDINARY_API_KEY:}
cloudinary.cloud_name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api_secret=${CLOUDINARY_API_SECRET:}

# Local advisory JD analysis; see docs/backend/jd-scanning.md.
jobs.ai.enabled=${GUARDWORK_AI_ENABLED:false}
jobs.ai.worker-enabled=${GUARDWORK_AI_WORKER_ENABLED:true}
jobs.ai.mode=${GUARDWORK_AI_MODE:stub}
jobs.ai.profile=${GUARDWORK_AI_PROFILE:jd-local-v1}
jobs.ai.legal-snapshot=${GUARDWORK_AI_LEGAL_SNAPSHOT:stub-v1}
jobs.ai.adapter-url=${GUARDWORK_AI_ADAPTER_URL:http://127.0.0.1:8011}
jobs.ai.shared-key=${GUARDWORK_AI_SHARED_KEY:local-development-only}
