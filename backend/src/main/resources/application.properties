spring.application.name=backend
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:postgresql://localhost:5432/backend_db
spring.datasource.username=backend_user
spring.datasource.password=backend_password
spring.datasource.driver-class-name=org.postgresql.Driver

guardwork.jwt.access-expiration-ms=${GUARDWORK_JWT_ACCESS_EXPIRATION_MS:900000}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

company.membership.notifications.worker-enabled=${COMPANY_MEMBERSHIP_NOTIFICATIONS_WORKER_ENABLED:true}
company.membership.notifications.poll-ms=${COMPANY_MEMBERSHIP_NOTIFICATIONS_POLL_MS:30000}
