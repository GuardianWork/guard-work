# version: "3.9"

services:
  postgres:
    image: postgres:18-alpine
    container_name: backend-postgres
    volumes:
      - pgdata:/var/lib/postgresql
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-backend_db}
      - POSTGRES_USER=${POSTGRES_USER:-backend_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-backend_password}
    ports:
      - "${POSTGRES_LOCAL_PORT:-5432}:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-easm_user} -d ${POSTGRES_DB:-backend_db}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  pgdata:
